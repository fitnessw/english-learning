const audio = document.getElementById('audio');
const subEn = document.getElementById('subEn');
const subZh = document.getElementById('subZh');
const progressBar = document.getElementById('progressBar');
const offsetSlider = document.getElementById('offsetSlider');
const offsetVal = document.getElementById('offsetVal');

// Sync offset shared with transcript.html via localStorage
const savedOffset = localStorage.getItem('syncOffset');
if (savedOffset !== null) {
  offsetSlider.value = savedOffset;
} else {
  offsetSlider.value = 0.5;
}
updateOffsetDisplay();

offsetSlider.addEventListener('input', () => {
  localStorage.setItem('syncOffset', offsetSlider.value);
  updateOffsetDisplay();
});

function updateOffsetDisplay() {
  const v = parseFloat(offsetSlider.value);
  offsetVal.textContent = (v >= 0 ? '+' : '') + v.toFixed(1) + 's';
}

function getOffset() { return parseFloat(offsetSlider.value); }

let lastIdx = -1;
audio.addEventListener('timeupdate', () => {
  const t = audio.currentTime - getOffset();
  // Progress bar
  if (audio.duration) {
    progressBar.style.width = (audio.currentTime / audio.duration * 100) + '%';
  }
  // Find current subtitle
  let idx = -1;
  for (let i = 0; i < SUBS.length; i++) {
    if (t >= SUBS[i].start && t < SUBS[i].start + SUBS[i].duration) {
      idx = i;
      break;
    }
  }
  if (idx !== lastIdx) {
    lastIdx = idx;
    if (idx >= 0) {
      subEn.textContent = SUBS[idx].text;
      subEn.className = 'sub-en';
      subZh.textContent = SUBS[idx].zh;
    } else {
      subEn.textContent = '-- subtitles will appear here --';
      subEn.className = 'sub-en sub-empty';
      subZh.textContent = '';
    }
  }
});

document.getElementById('progressOuter').addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  audio.currentTime = ratio * audio.duration;
});

function setSpeed(s) {
  audio.playbackRate = s;
  document.querySelectorAll('.speed-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.textContent) === s);
  });
}
</script>
